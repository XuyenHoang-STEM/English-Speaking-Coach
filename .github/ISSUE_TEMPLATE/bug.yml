name: Bug report
description: A reproducible problem in existing behavior
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected and what cannot be completed?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Browser/device/commit and sanitized screenshots or logs. Never attach learner content or secrets.
